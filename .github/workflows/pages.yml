name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Records the intro video (npm run video) for the site, in parallel with the
  # tests. It only changes with its sources, the drawing code and the fonts, so
  # the last recording is reused from the cache while those stay the same.
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - id: cache
        uses: actions/cache@v6
        with:
          path: |
            media/rackplanner-intro.mp4
            media/rackplanner-intro.webm
            media/rackplanner-intro.jpg
          key: intro-video-${{ runner.os }}-${{ hashFiles('media/intro.html', 'media/intro.js', 'media/record.js', 'js/model.js', 'js/io.js', 'js/render.js', 'js/cabling.js', 'js/cabling-render.js', 'js/power.js', 'js/power-render.js', 'css/fonts.css', 'fonts/**', 'package-lock.json') }}
      - name: Install dependencies, Chromium and ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Record the intro video
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run video
      - uses: actions/upload-artifact@v7
        with:
          name: intro-video
          path: |
            media/rackplanner-intro.mp4
            media/rackplanner-intro.webm
            media/rackplanner-intro.jpg
          if-no-files-found: error
          retention-days: 1

  # Builds the site and uploads it as the Pages artifact. A job of its own, so
  # the artifact is complete before the deploy job looks for it, and so a
  # re-run of a failed deploy does not upload a second copy of it.
  site:
    needs: [test, video]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site files
        run: |
          mkdir -p _site/media
          cp -r index.html css js fonts sw.js manifest.webmanifest icon.svg _site/
          cp media/index.html _site/media/
      - name: Add the intro video next to its player page
        uses: actions/download-artifact@v8
        with:
          name: intro-video
          path: _site/media
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploys the artifact of the site job. GitHub's artifact list can lag
  # behind an upload, so a failed deploy is tried once more after a pause.
  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
