name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Records the intro video (npm run video) for the site, in parallel with the
  # tests. Its music is downloaded from the INTRO_MUSIC_URL secret when that
  # is set (the track is not kept in git); otherwise the video gets the
  # soundtrack synthesized by media/soundtrack.js. It only changes with its
  # sources, the drawing code, the fonts and the music, so the last recording
  # is reused from the cache while those stay the same.
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fingerprint the music link for the cache key
        id: music
        env:
          MUSIC_URL: ${{ secrets.INTRO_MUSIC_URL }}
        run: echo "key=$(printf %s "$MUSIC_URL" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: |
            media/rackplanner-intro.mp4
            media/rackplanner-intro.webm
            media/rackplanner-intro.jpg
          key: intro-video-${{ runner.os }}-${{ steps.music.outputs.key }}-${{ hashFiles('media/intro.html', 'media/*.js', 'js/model.js', 'js/io.js', 'js/render.js', 'css/fonts.css', 'fonts/**', 'package-lock.json') }}
      - name: Install dependencies, Chromium and ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Record the intro video
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MUSIC_URL: ${{ secrets.INTRO_MUSIC_URL }}
        run: |
          if [ -n "$MUSIC_URL" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/music.mp3" "$MUSIC_URL"
            npm run video -- --music "$RUNNER_TEMP/music.mp3"
          else
            npm run video
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: intro-video
          path: |
            media/rackplanner-intro.mp4
            media/rackplanner-intro.webm
            media/rackplanner-intro.jpg
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [test, video]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Collect the site files
        run: |
          mkdir -p _site/media
          cp -r index.html css js fonts sw.js manifest.webmanifest icon.svg _site/
          cp media/index.html _site/media/
      - name: Add the intro video next to its player page
        uses: actions/download-artifact@v7
        with:
          name: intro-video
          path: _site/media
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
